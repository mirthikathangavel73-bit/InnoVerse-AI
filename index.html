
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InnoVerse AI</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f3f4f8;color:#20243a}
header{background:#27235c;color:white;padding:24px;text-align:center}
main{max-width:700px;margin:24px auto;padding:16px}
.card{background:white;padding:20px;border-radius:14px;margin-bottom:18px;box-shadow:0 3px 12px #ddd}
input,textarea,select,button{box-sizing:border-box;width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px;font-size:16px}
button{background:#5146c8;color:white;border:0;font-weight:bold}
.problem{border-left:5px solid #5146c8;padding:12px;background:#f7f6ff;margin-top:12px;border-radius:8px}
small{color:#666}
</style>
</head>
<body>
<header>
<h1>🌍 InnoVerse AI</h1>
<p>Every great innovation starts with the right problem.</p>
</header>
<main>
<div class="card">
<h2>Share a Community Problem</h2>
<form id="problemForm">
<input id="title" placeholder="Problem title" required>
<textarea id="details" placeholder="Describe the problem..." required></textarea>
<select id="category">
<option>Environment</option>
<option>Education</option>
<option>Public Infrastructure</option>
<option>Digital Inclusion</option>
<option>Other</option>
</select>
<select id="priority">
<option>High Priority</option>
<option>Medium Priority</option>
<option>Low Priority</option>
</select>
<button type="submit">Submit Problem</button>
</form>
</div>
<div class="card">
<h2>Community Challenges</h2>
<div id="problems"><small>No problems submitted yet. Add the first one!</small></div>
</div>
</main>
<script>
const form=document.getElementById('problemForm');
form.addEventListener('submit',function(e){
e.preventDefault();
const title=document.getElementById('title').value.trim();
const details=document.getElementById('details').value.trim();
const category=document.getElementById('category').value;
const priority=document.getElementById('priority').value;
if(!title||!details)return;
const item=document.createElement('div');
item.className='problem';
const heading=document.createElement('h3');
heading.textContent=title;
const description=document.createElement('p');
description.textContent=details;
const info=document.createElement('small');
info.textContent=category+' • '+priority;
item.append(heading,description,info);
const list=document.getElementById('problems');
if(!list.querySelector('.problem'))list.replaceChildren();
list.prepend(item);
form.reset();
});
</script>
</body>
</html>
